  short_description: "Author-controlled scientific manuscript editing"
  default_prompt: "Use $scientific-manuscript-editor to help with this manuscript while preserving the author's scientific position, evidence boundaries, and requested scope. If the task could change scientific meaning or the intended operation is unclear, clarify the author's intent before substantive editing."

